# IST Health — production nginx (React SPA + Tryton proxy + legacy SAO)
# Primary host: health.irisstar.tech
# Hardened: trytond on 127.0.0.1:8000 only; SAO via /sao/
#
# Until Let's Encrypt succeeds, :80 dual-serves and :443 uses self-signed.
# After LE: replace :80 body with return 301 + enable HSTS (see docs/HTTPS.md).
# Or run: frontend/deploy/harden-https-subdomain.sh

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name health.irisstar.tech 34.18.116.146 _;
    client_max_body_size 50m;

    root /var/www/ist-health/frontend/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location /api/tryton/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /isthealth/ {
        proxy_pass http://127.0.0.1:8000/isthealth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Temporary redirect after DB rename gnuhealth -> isthealth
    location = /gnuhealth {
        return 301 /isthealth/;
    }
    location /gnuhealth/ {
        return 301 /isthealth/;
    }

    location /sao/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /legal/ {
        try_files $uri $uri/ =404;
    }

    location /styles/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name health.irisstar.tech 34.18.116.146 _;
    client_max_body_size 50m;

    # Self-signed until certbot succeeds; then:
    # ssl_certificate     /etc/letsencrypt/live/health.irisstar.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/health.irisstar.tech/privkey.pem;
    ssl_certificate     /etc/nginx/ssl/ist-health/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ist-health/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Enable after Let's Encrypt:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/ist-health/frontend/dist;
    index index.html;

    location /api/tryton/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /isthealth/ {
        proxy_pass http://127.0.0.1:8000/isthealth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Temporary redirect after DB rename gnuhealth -> isthealth
    location = /gnuhealth {
        return 301 /isthealth/;
    }
    location /gnuhealth/ {
        return 301 /isthealth/;
    }

    location /sao/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /legal/ {
        try_files $uri $uri/ =404;
    }

    location /styles/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
